<!doctype html><html><head><meta charset="utf-8"><title>Início</title>
<style>html,body{margin:0;height:100%;background:#000}</style></head>
<body>
<script>
// Carregador: abre sempre a versão mais nova da tela (app.html), fixada pelo commit,
// para não depender do cache do CDN. Se o GitHub não responder, usa a branch main.
(function(){
  var REPO='joaolucasgonca-sketch/tv-inicio', done=false;
  function go(ref){
    if(done) return; done=true;
    location.replace('http://127.0.0.1:8081/module/'+encodeURIComponent('gh/'+REPO+'@'+ref)+'/app.html');
  }
  try{
    var x=new XMLHttpRequest();
    x.open('GET','https://api.github.com/repos/'+REPO+'/commits/main',true);
    x.timeout=3000;
    x.onreadystatechange=function(){
      if(x.readyState!==4) return;
      try{ if(x.status===200){ go(JSON.parse(x.responseText).sha.substr(0,7)); return; } }catch(e){}
      go('main');
    };
    x.ontimeout=function(){ go('main'); };
    x.send();
  }catch(e){ go('main'); }
  setTimeout(function(){ go('main'); }, 4000);
})();
</script>
</body></html>
