<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Início</title>
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background-color:#0a0a0c;
    background-image:
      radial-gradient(ellipse at 85% 0%, #1a1140 0%, rgba(10,10,12,0) 60%),
      radial-gradient(ellipse at 0% 100%, #06283d 0%, rgba(10,10,12,0) 55%);
    color:#f5f5f7;
    font-family:"SamsungOne","Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
  }
  .top{ height:200px; padding:64px 80px 0; position:relative; }
  .hello{font-size:40px; font-weight:600; color:#f5f5f7;}
  .hello small{display:block; font-size:20px; color:#9a9aa2; font-weight:400; margin-top:6px;}
  .clock{position:absolute; right:80px; top:80px; font-size:34px; font-weight:500; color:#e9e9ee;}
  .grid{ padding:0 62px; font-size:0; }
  .tile{
    display:inline-block; vertical-align:top;
    width:400px; height:228px; margin:18px;
    position:relative; border-radius:28px; overflow:hidden;
    background-color:#1b1b20;
    -webkit-transform:scale(1); transform:scale(1);
    -webkit-transition:-webkit-transform .18s ease; transition:transform .18s ease;
    box-shadow:0 10px 30px rgba(0,0,0,.45);
  }
  .tile .bg{position:absolute; top:0; left:0; right:0; bottom:0;}
  .tile .label{
    position:absolute; left:0; bottom:0; padding:26px 28px;
    font-size:30px; font-weight:700; color:#fff;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  .tile .sub{display:block; font-size:17px; font-weight:500; opacity:.85; margin-top:4px;}
  .tile.focused{
    -webkit-transform:scale(1.08); transform:scale(1.08);
    box-shadow:0 18px 50px rgba(0,0,0,.6), 0 0 0 5px #ffffff;
    z-index:3;
  }
  .hint{ position:fixed; bottom:28px; left:0; right:0; text-align:center; color:#9a9aa2; font-size:18px; }
</style>
</head>
<body>
  <div class="top">
    <div class="hello">Olá<small id="date"></small></div>
    <div class="clock" id="clock">--:--</div>
  </div>
  <div class="grid" id="grid"></div>
  <div class="hint">Use as setas e aperte OK para abrir</div>

<script>
(function(){
  // appId = ID do app instalado na TV (confirmado pela API da Samsung)
  var APPS = [
    { name:"YouTube",   sub:"sem anúncios", appId:"xvvl3S1bvH.TizenBrewStandalone", c1:"#ff2d55", c2:"#8a0f26" },
    { name:"Netflix",   sub:"",             appId:"11101200001",   c1:"#e50914", c2:"#5a0309" },
    { name:"Prime Video", sub:"",           appId:"3201512006785", c1:"#1fb6ff", c2:"#0b3a6b" },
    { name:"Disney+",   sub:"",             appId:"3201901017640", c1:"#1f6feb", c2:"#0b1d57" },
    { name:"Globoplay", sub:"",             appId:"3201510005787", c1:"#ff4d4d", c2:"#7a1230" },
    { name:"HBO Max",   sub:"",             appId:"3201810017024", c1:"#7b2ff7", c2:"#2a0b57" },
    { name:"Apple TV",  sub:"",             appId:"3202106024097", c1:"#3a3a3c", c2:"#0b0b0c" },
    { name:"Spotify",   sub:"música",       appId:"3201606009684", c1:"#1ed760", c2:"#0b4d26" }
  ];

  var COLS = 4;
  var grid = document.getElementById('grid');
  var tiles = [];
  var cur = 0;

  APPS.forEach(function(a, i){
    var t = document.createElement('div');
    t.className = 'tile';
    t.innerHTML =
      '<div class="bg" style="background:linear-gradient(135deg,'+a.c1+' 0%,'+a.c2+' 100%)"></div>' +
      '<div class="label">'+a.name+(a.sub?'<span class="sub">'+a.sub+'</span>':'')+'</div>';
    t.addEventListener('click', function(){ launch(a.appId); });
    grid.appendChild(t);
    tiles.push(t);
  });

  function focus(i){
    if(i<0||i>=tiles.length) return;
    tiles[cur].classList.remove('focused');
    cur = i;
    tiles[cur].classList.add('focused');
  }

  function launch(appId){
    try{
      if(window.tizen && tizen.application && tizen.application.launch){
        tizen.application.launch(appId,
          function(){},
          function(e){ alert('Não consegui abrir o app ('+ (e && e.message ? e.message : appId) +').'); }
        );
        return;
      }
    }catch(e){}
    // fora da TV (teste no navegador): só mostra o alvo
    alert('Abriria: ' + appId);
  }

  document.addEventListener('keydown', function(e){
    var k = e.keyCode;
    if(k===37){ if(cur%COLS!==0) focus(cur-1); }        // esquerda
    else if(k===39){ if(cur%COLS!==COLS-1) focus(cur+1); } // direita
    else if(k===38){ if(cur-COLS>=0) focus(cur-COLS); }    // cima
    else if(k===40){ if(cur+COLS<tiles.length) focus(cur+COLS); } // baixo
    else if(k===13){ launch(APPS[cur].appId); }            // OK
    else return;
    e.preventDefault();
  });

  function pad(n){ return (n<10?'0':'')+n; }
  function tick(){
    var d = new Date();
    document.getElementById('clock').textContent = pad(d.getHours())+':'+pad(d.getMinutes());
    var dias=['domingo','segunda','terça','quarta','quinta','sexta','sábado'];
    var mes=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    document.getElementById('date').textContent = dias[d.getDay()]+', '+d.getDate()+' '+mes[d.getMonth()];
  }
  tick(); setInterval(tick, 10000);

  focus(0);
})();
</script>
</body>
</html>
